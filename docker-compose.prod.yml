x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  django:
    <<: *restart
  airflow-postgres:
    <<: *restart
  airflow-webserver:
    <<: *restart
  airflow-scheduler:
    <<: *restart

  caddy:
    <<: *restart
    image: caddy:2-alpine
    depends_on:
      - django
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-data.pgi.com.vn}
      CADDY_TLS_ARGS: ${CADDY_TLS_ARGS:-/certs/fullchain.crt /certs/privkey.key}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
