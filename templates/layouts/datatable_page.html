{% extends "base.html" %}

{% block early_loading %}<script>Loading.show("Đang tải dữ liệu...");</script>{% endblock %}
{% block content %}
<div class="card shadow mb-4">
  <div class="card-header py-3">
    <h6 class="m-0 font-weight-bold text-primary">{% block card_title %}{% endblock %}</h6>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-bordered" id="{% block table_id %}{% endblock %}" data-table-key="{% block table_key %}{% endblock %}" width="100%" cellspacing="0">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
