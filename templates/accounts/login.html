{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập - Data Warehouse</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}" />
    <link
      href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/vendor/fontawesome-free/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    {# trang dang nhap khong dung theme chung (index.css) - chi nap token, font, loading + CSS rieng #}
    <link href="{% static 'css/base/variables.css' %}" rel="stylesheet" />
    <link href="{% static 'css/base/typography.css' %}" rel="stylesheet" />
    <link href="{% static 'css/components/loading.css' %}" rel="stylesheet" />
    <link href="{% static 'css/pages/accounts/login.css' %}" rel="stylesheet" />
  </head>
  <body class="login-page">
    <div class="login-bg" aria-hidden="true"></div>
    <main class="login-wrapper">
      <section class="login-card">
        <div class="login-logo" role="img" aria-label="PGI"></div>
        <h2 class="login-title">Đăng nhập</h2>
        <p class="login-subtitle">Hệ thống Data Warehouse PGI</p>

        {% if messages %}
          {% for message in messages %}
            <div class="login-alert" role="alert"><i class="fas fa-exclamation-circle"></i> {{ message }}</div>
          {% endfor %}
        {% endif %}

        <form method="post" data-loading data-loading-message="Đang đăng nhập..." autocomplete="on">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}" />

          <label class="login-label" for="loginUsername">Tên đăng nhập</label>
          <div class="login-field">
            <input type="text" id="loginUsername" name="username" value="{{ username|default:'' }}" autocomplete="username" required {% if not username %}autofocus{% endif %} />
          </div>

          <label class="login-label" for="loginPassword">Mật khẩu</label>
          <div class="login-field">
            <input type="password" id="loginPassword" name="password" autocomplete="current-password" required {% if username %}autofocus{% endif %} />
            <button type="button" class="login-toggle-password" id="loginTogglePassword" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
              <i class="fas fa-eye"></i>
            </button>
          </div>

          <label class="login-label" for="loginCaptcha">Mã xác nhận</label>
          <div class="login-captcha-row">
            <div class="login-field login-captcha-input">
              <input type="text" id="loginCaptcha" name="captcha" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required />
            </div>
            <img class="login-captcha-img" id="loginCaptchaImg" src="{% url 'login-captcha' %}" alt="Mã xác nhận" width="150" height="52" />
            <button type="button" class="login-captcha-refresh" id="loginCaptchaRefresh" aria-label="Đổi mã khác" title="Đổi mã khác">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>

          <button type="submit" class="login-submit" id="loginSubmit" disabled>Đăng nhập</button>
        </form>
      </section>
    </main>

    <script src="{% static 'js/core/loading.js' %}"></script>
    <script src="{% static 'js/pages/accounts/login.js' %}"></script>
  </body>
</html>
